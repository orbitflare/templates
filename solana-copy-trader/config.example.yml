# Solana Copy Trader configuration. Environment variables expand as ${VAR_NAME}.
# Copy to config.yml and edit for your setup.

jetstream:
  url: "${ORBITFLARE_GRPC_ENDPOINT}"
  timeout_secs: 30
  tcp_keepalive_secs: 60
  channel_buffer_size: 10000
  reconnect:
    initial_delay_ms: 100
    max_delay_ms: 30000
    multiplier: 2.0

yellowstone:
  enabled: true
  url: "${YELLOWSTONE_GRPC_ENDPOINT}"
  timeout_secs: 30
  tcp_keepalive_secs: 60
  channel_buffer_size: 10000
  reconnect:
    initial_delay_ms: 100
    max_delay_ms: 30000
    multiplier: 2.0

rpc:
  url: "${ORBITFLARE_RPC_URL}"
  timeout_secs: 10
  max_retries: 3
  commitment: "confirmed"

targets:
  - address: "WhaleWallet111111111111111111111111111111111"
    label: "whale-alpha"
    enabled: true
    sizing:
      mode: "proportional"
      proportion: 0.05

  - address: "WhaleWallet222222222222222222222222222222222"
    label: "whale-beta"
    enabled: true
    sizing:
      mode: "fixed"
      fixed_amount_sol: 0.5

execution:
  dry_run: true

  sizing:
    mode: "fixed"
    fixed_amount_sol: 0.1
    proportion: 0.1
    max_trade_sol: 5.0
    min_trade_sol: 0.01

  slippage:
    default_bps: 300
    max_bps: 1000

  priority_fee:
    strategy: "dynamic"
    fixed_lamports: 100000
    dynamic_percentile: 75
    max_lamports: 5000000

  jito:
    enabled: false
    tip_lamports: 50000
    block_engine_url: "https://mainnet.block-engine.jito.wtf"

  confirmation:
    strategy: "poll"
    timeout_secs: 30
    poll_interval_ms: 500

safety:
  max_daily_trades: 100
  max_hourly_trades: 20
  cooldown_per_token_secs: 60
  max_open_positions: 10
  max_portfolio_sol: 50.0

  token_filters:
    blacklisted_tokens: []
    min_liquidity_sol: 10.0
    require_mint_renounced: false
    require_freeze_renounced: true
    min_token_age_secs: 300

decoders:
  jupiter:
    enabled: true
    program_id: "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"
  raydium_amm:
    enabled: true
    program_id: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
  raydium_cpmm:
    enabled: true
    program_id: "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"
  pumpfun:
    enabled: true
    program_id: "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"

redis:
  url: "${REDIS_URL}"
  prefix: "copytrader:"
  dedup_ttl_secs: 300
  price_cache_ttl_secs: 10
  position_sync_interval_secs: 5

metrics:
  enabled: true
  listen: "0.0.0.0:9090"

logging:
  level: "info"
  format: "json"
  log_transactions: true
  log_simulations: true

notifications:
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    notify_on:
      - "trade_executed"
      - "trade_failed"
      - "safety_triggered"
      - "stream_reconnect"

journal:
  enabled: false
  database_url: "${DATABASE_URL}"
